[project]
name = "map-every-village"
version = "0.1.0"
description = "Find unmapped African villages from AI building predictions, for field verification."
readme = "README.md"
license = "GPL-3.0-only"
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.5.2",
    "httpx>=0.28",
    "psycopg[binary]>=3.2",
]

[project.scripts]
mev = "mev.cli:main"

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mev"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S"]
ignore = ["S603", "S607", "S608"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]
