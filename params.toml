# Defaults for every country. Override with an [ISO3] table after tuning.
# Why these values: docs/how-it-works.md.

[default]
cell_deg = 0.00025          # grid cell size, ~28 m
min_confidence = 0.65       # Google's floor: keep all predictions
eps_m = 100                 # max gap between cells of one settlement (m)
min_buildings = 5           # smallest settlement kept
tile_deg = 0.5              # clustering tile size
project_admin_level = 3     # admin level of Field-TM projects (or deepest available)
village_buildings = 50      # GRID3's hamlet/small settlement boundary (docs/prioritising.md)
town_buildings = 1000
group_m = 200               # group_id: link to the biggest candidate this close; 0 = off

# Counts as in OSM if a place of this type is within this distance (m) of the outline.
[default.place_buffer_m]
city = 3000
town = 1500
village = 500
hamlet = 250
isolated_dwelling = 100
residential = 0             # named landuse=residential

# village_buildings: fewer than 80% of matched OSM villages reach the default 50,
# so their 20th percentile (scripts/calibrate.py, docs/prioritising.md).
# group_m: the default 200 m groups over 10% of OSM villages with another one, so the
# largest of 150/100 m that doesn't, else 0 (off).

[BEN]
village_buildings = 30    # keeps 74% -> 80% of 3263 OSM villages
group_m = 100             # 200 m groups 17% of OSM villages

